<nav class="navbar navbar-expand-lg rl-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand rl-logo" href="{% url 'core:home' %}">
            <span class="rl-logo-icon"><i class="bi bi-tools"></i></span>
            <span>Repair<span class="rl-logo-accent">Link</span></span>
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.app_name == 'core' %}active{% endif %}" href="{% url 'core:home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.app_name == 'services' %}active{% endif %}" href="{% url 'services:list' %}">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.app_name == 'providers' %}active{% endif %}" href="{% url 'providers:list' %}">Find Professionals</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}#how-it-works">How It Works</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>

            {% if user.is_authenticated %}
            <div class="dropdown pb-3 pb-lg-0">
                <button class="btn btn-rl-outline dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle me-1"></i> {{ user.first_name|default:user.username }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'dashboard:home' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
            {% else %}
            <div class="d-flex gap-2 pb-3 pb-lg-0">
                <a href="{% url 'accounts:login' %}" class="btn btn-rl-outline">Login</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-rl-primary">Get Started</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
